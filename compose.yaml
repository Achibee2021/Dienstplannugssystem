services:
  postgres:
    image: 'postgres:latest'
    container_name: dienstplan-db
    environment:
      - 'POSTGRES_DB=dienstplan'
      - 'POSTGRES_PASSWORD=password'
      - 'POSTGRES_USER=ach'
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ach -d dienstplan"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: dienstplan-backend
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/dienstplan
      SPRING_DATASOURCE_USERNAME: ach
      SPRING_DATASOURCE_PASSWORD: password
    ports:
      - "8080:8080"

  frontend:
    build:
      context: ./dienstplanung-frontend
      dockerfile: Dockerfile.frontend
    container_name: dienstplan-frontend
    depends_on:
      - backend
    ports:
      - "80:80"

volumes:
    postgres_data:


